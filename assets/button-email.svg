<svg xmlns="http://www.w3.org/2000/svg" width="210" height="56" viewBox="0 0 210 56" fill="none">
  <defs>
    <!-- 3D Surface Gradient -->
    <linearGradient id="emailBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162638"/>
      <stop offset="40%" stop-color="#0f1926"/>
      <stop offset="100%" stop-color="#09101a"/>
    </linearGradient>

    <!-- Glowing 3D Border Gradient -->
    <linearGradient id="emailBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00a8c6"/>
      <stop offset="100%" stop-color="#003b5c"/>
    </linearGradient>

    <!-- Icon Badge Background -->
    <linearGradient id="emailIconBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a8c6"/>
      <stop offset="100%" stop-color="#004e63"/>
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="emailCornerGlow" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Deep Base Shadow (3D elevation) -->
  <rect x="3" y="8" width="204" height="45" rx="14" fill="#000000" opacity="0.6"/>

  <!-- 2. 3D Bevel Extrusion Rim (Thickness depth) -->
  <rect x="3" y="5" width="204" height="47" rx="14" fill="#02283a"/>

  <!-- 3. Main Button Face Surface -->
  <rect x="3" y="3" width="204" height="46" rx="13" fill="url(#emailBtnGrad)"/>
  <rect x="3" y="3" width="204" height="46" rx="13" fill="url(#emailCornerGlow)"/>

  <!-- 4. Top Specular Light Reflection (Glass highlight) -->
  <path d="M 18 4.5 L 192 4.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 5. 3D Border Stroke -->
  <rect x="3" y="3" width="204" height="46" rx="13" fill="none" stroke="url(#emailBorderGrad)" stroke-width="1.3"/>

  <!-- 6. Icon 3D Container Badge -->
  <!-- Icon base shadow -->
  <rect x="14" y="13" width="30" height="30" rx="9" fill="#00263b"/>
  <!-- Icon surface -->
  <rect x="14" y="11" width="30" height="30" rx="8" fill="url(#emailIconBg)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Icon top reflection -->
  <path d="M 18 12 L 40 12" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Email Vector Graphic (Envelope) -->
  <g transform="translate(19, 17) scale(0.83)">
    <path fill="#FFFFFF" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
  </g>

  <!-- 7. Typography -->
  <!-- Micro Subheading Tag -->
  <text x="54" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#00E5FF">GET IN TOUCH</text>

  <!-- Main Label -->
  <text x="54" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Email Me</text>

  <!-- 8. Right Action Chevron with 3D glow -->
  <circle cx="186" cy="26" r="10" fill="#0c1724" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M 184 21 L 189 26 L 184 31" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
