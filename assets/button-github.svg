<svg xmlns="http://www.w3.org/2000/svg" width="210" height="56" viewBox="0 0 210 56" fill="none">
  <defs>
    <!-- 3D Surface Gradient -->
    <linearGradient id="ghBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162638"/>
      <stop offset="40%" stop-color="#0f1926"/>
      <stop offset="100%" stop-color="#09101a"/>
    </linearGradient>

    <!-- Glowing 3D Border Gradient -->
    <linearGradient id="ghBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#24292e"/>
      <stop offset="100%" stop-color="#003b5c"/>
    </linearGradient>

    <!-- Icon Badge Background -->
    <linearGradient id="ghIconBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b3137"/>
      <stop offset="100%" stop-color="#181a1b"/>
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="ghCornerGlow" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Deep Base Shadow (3D elevation) -->
  <rect x="3" y="8" width="204" height="45" rx="14" fill="#000000" opacity="0.6"/>

  <!-- 2. 3D Bevel Extrusion Rim (Thickness depth) -->
  <rect x="3" y="5" width="204" height="47" rx="14" fill="#02283a"/>

  <!-- 3. Main Button Face Surface -->
  <rect x="3" y="3" width="204" height="46" rx="13" fill="url(#ghBtnGrad)"/>
  <rect x="3" y="3" width="204" height="46" rx="13" fill="url(#ghCornerGlow)"/>

  <!-- 4. Top Specular Light Reflection (Glass highlight) -->
  <path d="M 18 4.5 L 192 4.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 5. 3D Border Stroke -->
  <rect x="3" y="3" width="204" height="46" rx="13" fill="none" stroke="url(#ghBorderGrad)" stroke-width="1.3"/>

  <!-- 6. Icon 3D Container Badge -->
  <!-- Icon base shadow -->
  <rect x="14" y="13" width="30" height="30" rx="9" fill="#00263b"/>
  <!-- Icon surface -->
  <rect x="14" y="11" width="30" height="30" rx="8" fill="url(#ghIconBg)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Icon top reflection -->
  <path d="M 18 12 L 40 12" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.8" stroke-linecap="round"/>

  <!-- GitHub Octocat Vector Graphic -->
  <g transform="translate(19, 16) scale(0.83)">
    <path fill="#FFFFFF" fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
  </g>

  <!-- 7. Typography -->
  <!-- Micro Subheading Tag -->
  <text x="54" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#00E5FF">FOLLOW</text>

  <!-- Main Label -->
  <text x="54" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">GitHub</text>

  <!-- 8. Right Action Chevron with 3D glow -->
  <circle cx="186" cy="26" r="10" fill="#0c1724" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M 184 21 L 189 26 L 184 31" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
