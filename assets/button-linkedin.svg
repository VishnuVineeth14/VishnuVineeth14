<svg xmlns="http://www.w3.org/2000/svg" width="210" height="56" viewBox="0 0 210 56" fill="none">
  <defs>
    <!-- 3D Surface Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162638"/>
      <stop offset="40%" stop-color="#0f1926"/>
      <stop offset="100%" stop-color="#09101a"/>
    </linearGradient>

    <!-- Glowing 3D Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0077b5"/>
      <stop offset="100%" stop-color="#003b5c"/>
    </linearGradient>

    <!-- Icon Badge Background -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077b5"/>
      <stop offset="100%" stop-color="#004165"/>
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="cornerGlow" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Deep Base Shadow (3D elevation) -->
  <rect x="3" y="8" width="204" height="45" rx="14" fill="#000000" opacity="0.6"/>

  <!-- 2. 3D Bevel Extrusion Rim (Thickness depth) -->
  <rect x="3" y="5" width="204" height="47" rx="14" fill="#02283a"/>

  <!-- 3. Main Button Face Surface -->
  <rect x="3" y="3" width="204" height="46" rx="13" fill="url(#btnGrad)"/>
  <rect x="3" y="3" width="204" height="46" rx="13" fill="url(#cornerGlow)"/>

  <!-- 4. Top Specular Light Reflection (Glass highlight) -->
  <path d="M 18 4.5 L 192 4.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 5. 3D Border Stroke -->
  <rect x="3" y="3" width="204" height="46" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.3"/>

  <!-- 6. Icon 3D Container Badge -->
  <!-- Icon base shadow -->
  <rect x="14" y="13" width="30" height="30" rx="9" fill="#00263b"/>
  <!-- Icon surface -->
  <rect x="14" y="11" width="30" height="30" rx="8" fill="url(#iconBg)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Icon top reflection -->
  <path d="M 18 12 L 40 12" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.8" stroke-linecap="round"/>

  <!-- LinkedIn Vector Graphic -->
  <g transform="translate(19, 16) scale(0.83)">
    <path fill="#FFFFFF" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
  </g>

  <!-- 7. Typography -->
  <!-- Micro Subheading Tag -->
  <text x="54" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#00E5FF">CONNECT</text>

  <!-- Main Label -->
  <text x="54" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">LinkedIn</text>

  <!-- 8. Right Action Chevron with 3D glow -->
  <circle cx="186" cy="26" r="10" fill="#0c1724" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M 184 21 L 189 26 L 184 31" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
